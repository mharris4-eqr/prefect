name: Docker Image CI

on:
  push:
    branches: [ "2.20.7-aci_standbypool" ]
  pull_request:
    branches: [ "2.20.7-aci_standbypool" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Azure Container Registry
      - name: Azure Container Registry Login
        uses: Azure/docker-login@v1.0.1
        with:
          username: ${{ secrets.acr_username }} # Set this secret in your GitHub repository
          password: ${{ secrets.acr_password }} # Set this secret in your GitHub repository
          login-server: ${{ secrets.acr_login_url }} # Set this secret in your GitHub repository (e.g., labeqracr.azurecr.io)

      # Build and push Docker images
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          build-args:  PYTHON_VERSION=3.10
          push: true
          pull: true
          tags: labeqracr.azurecr.io/eqr-prefect:2.20.7-sp # Replace with your ACR repository and tag
